<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dwgforge — эд ангийн үүсгэгч</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --ink: #e6e8ee;
    --dim: #9aa3b2; --accent: #4c8dff; --ok: #3ecf8e; --err: #ff6b6b;

    /* Blender-ийн харанхуй загвар — 3D хэсэгт л хэрэглэнэ */
    --b-head: #1d1d1d; --b-view: #393939; --b-panel: #303030; --b-field: #545454;
    --b-ink: #e5e5e5; --b-dim: #9d9d9d; --b-accent: #4772b3; --b-edge: #232323;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa; --panel: #ffffff; --line: #dfe4ec; --ink: #1a1f2b;
      --dim: #67707f; --accent: #2563eb; --ok: #0f9d58; --err: #d93025;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    padding: 18px 24px; border-bottom: 1px solid var(--line);
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -.01em; }
  header .sub { color: var(--dim); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(340px, 420px) 1fr; gap: 0; min-height: calc(100vh - 62px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } }
  .pane { padding: 22px 24px; }
  .pane + .pane { border-left: 1px solid var(--line); display: flex; flex-direction: column; }
  @media (max-width: 820px) { .pane + .pane { border-left: 0; border-top: 1px solid var(--line); } }

  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px; }
  .tab {
    padding: 7px 14px; border: 1px solid var(--line); background: var(--panel);
    color: var(--dim); border-radius: 7px; cursor: pointer; font-size: 14px;
  }
  .tab:hover { color: var(--ink); }
  .tab.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

  .field { margin-bottom: 13px; }
  .field label { display: block; font-size: 13px; color: var(--dim); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border-radius: 7px; font-size: 15px;
    border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .field .hint { font-size: 12px; color: var(--dim); margin-top: 3px; }

  button.go {
    width: 100%; margin-top: 8px; padding: 12px; font-size: 15px; font-weight: 650;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button.go:disabled { opacity: .55; cursor: progress; }

  .msg { margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 14px;
         border: 1px solid var(--line); background: var(--panel); white-space: pre-wrap; }
  .msg.ok { border-color: var(--ok); }
  .msg.err { border-color: var(--err); color: var(--err); }

  h2 { font-size: 14px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--dim); margin: 18px 0 12px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; color: var(--dim); }
  .path { font-family: Consolas, monospace; font-size: 12px; color: var(--dim);
          word-break: break-all; margin-top: 14px; }
  tbody tr { cursor: pointer; }
  tbody tr:hover td { color: var(--accent); }
  tbody tr.on td { color: var(--accent); font-weight: 600; }

  /* ---------------- 3D харагдац — Blender-ийн засварлагчийн хэлбэр -------- */

  .vp {
    height: clamp(380px, 58vh, 660px); display: flex; flex-direction: column;
    border-radius: 6px; overflow: hidden; background: var(--b-view);
    border: 1px solid var(--b-edge); color: var(--b-ink);
    font: 12.5px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none;
  }
  .vp-head {
    display: flex; align-items: center; gap: 2px; padding: 3px 6px;
    background: var(--b-head); border-bottom: 1px solid #101010; flex: none;
  }
  .vp-ed {
    display: grid; place-items: center; width: 24px; height: 22px; margin-right: 4px;
    border-radius: 4px; background: #2c2c2c; color: #b9b9b9;
  }
  .vp-menu {
    background: none; border: 0; color: var(--b-ink); font: inherit;
    padding: 4px 9px; border-radius: 4px; cursor: pointer;
  }
  .vp-menu:hover { background: #333; }
  .vp-gap { flex: 1; }
  .vp-shades { display: flex; background: #2c2c2c; border-radius: 12px; padding: 2px; }
  .vp-shades button, .vp-btn {
    background: none; border: 0; color: #c2c2c2; cursor: pointer; padding: 3px 7px;
    border-radius: 11px; display: grid; place-items: center;
  }
  .vp-shades button:hover, .vp-btn:hover { color: #fff; background: #3f3f3f; }
  .vp-shades button.on { background: var(--b-accent); color: #fff; }
  .vp-btn { margin-left: 6px; background: #2c2c2c; border-radius: 4px; }

  .vp-body { position: relative; flex: 1; min-height: 0; }
  canvas.vp-gl { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  canvas.vp-gl:active { cursor: grabbing; }

  .vp-corner {
    position: absolute; left: 10px; top: 8px; pointer-events: none;
    text-shadow: 0 1px 2px rgba(0,0,0,.55); line-height: 1.35;
  }
  .vp-corner b { display: block; font-weight: 600; }
  .vp-corner span { color: var(--b-dim); }

  canvas.vp-gizmo {
    position: absolute; right: 8px; top: 6px; width: 120px; height: 120px;
    cursor: pointer; touch-action: none;
  }
  .vp-stats {
    position: absolute; right: 14px; top: 130px; text-align: right; color: var(--b-dim);
    pointer-events: none; text-shadow: 0 1px 2px rgba(0,0,0,.55);
  }

  .vp-np {
    position: absolute; right: 0; top: 0; bottom: 0; width: 186px; overflow: auto;
    background: rgba(48,48,48,.94); border-left: 1px solid #232323; padding: 6px 8px 14px;
    transform: translateX(0); transition: transform .16s ease;
  }
  .vp-np.off { transform: translateX(100%); }
  .vp-np .np-head {
    font-weight: 600; padding: 3px 4px 7px; border-bottom: 1px solid #262626; margin-bottom: 8px;
  }
  .vp-np .np-name { color: var(--b-accent); font-weight: 600; padding: 0 4px 8px; word-break: break-all; }
  .vp-np .np-title { color: var(--b-dim); margin: 10px 0 4px; padding-left: 4px; }
  .vp-np .np-row {
    display: flex; justify-content: space-between; gap: 6px; background: var(--b-field);
    border-radius: 4px; padding: 3px 8px; margin-bottom: 3px;
  }
  .vp-np .np-row span { color: #d0d0d0; }
  .vp-np .np-row i { font-style: normal; font-variant-numeric: tabular-nums; }
  .vp-np .np-empty { color: var(--b-dim); padding: 6px 4px; }
  /* Gizmo нь самбарын доор дарагдахгүйн тулд самбар нээлттэй үед зүүн тийш */
  .vp-np:not(.off) ~ canvas.vp-gizmo, .vp-np:not(.off) ~ .vp-stats { right: 194px; }

  .vp-drop {
    position: absolute; top: 0; min-width: 210px; z-index: 5; padding: 4px;
    background: #232323; border: 1px solid #111; border-radius: 5px;
    box-shadow: 0 8px 22px rgba(0,0,0,.5);
  }
  .vp-drop button {
    display: flex; width: 100%; justify-content: space-between; gap: 16px;
    background: none; border: 0; color: var(--b-ink); font: inherit; text-align: left;
    padding: 5px 9px; border-radius: 4px; cursor: pointer;
  }
  .vp-drop button:hover { background: var(--b-accent); }
  .vp-drop button i { font-style: normal; color: var(--b-dim); }
  .vp-drop button:hover i { color: #dbe6f7; }
  .vp-drop hr { border: 0; border-top: 1px solid #333; margin: 4px 2px; }

  .vp-toast {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    background: rgba(20,20,20,.88); border: 1px solid #111; border-radius: 6px;
    padding: 9px 16px; display: none; pointer-events: none;
  }
  .vp-toast.on { display: block; }

  .vp-render {
    position: absolute; inset: 8px; z-index: 6; background: #202020;
    border: 1px solid #111; border-radius: 6px; display: flex; flex-direction: column;
    box-shadow: 0 10px 30px rgba(0,0,0,.55);
  }
  .vp-render[hidden] { display: none; }
  .vp-render .rr-head {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--b-head); padding: 4px 6px 4px 10px; border-bottom: 1px solid #111;
  }
  .vp-render .rr-head button {
    background: none; border: 0; color: var(--b-dim); cursor: pointer; font-size: 14px;
    padding: 2px 8px; border-radius: 4px;
  }
  .vp-render .rr-head button:hover { background: #3f3f3f; color: #fff; }
  /* min-height:0 — үүнгүй бол уян хайрцаг доторх зураг өөрийн хэмжээгээр
     хайрцгийг сунгаж, доод тал нь тасарна. Зургийг хувиар биш, хайрцгийг
     бүтэн эзлүүлээд object-fit-ээр багтаана: хувийн max-height нь мөрийн
     өндөр тодорхойгүй үед үйлчлэхгүй. */
  .vp-render .rr-body {
    flex: 1; min-height: 0; display: flex; align-items: center;
    justify-content: center; background: #2b2b2b; overflow: hidden; padding: 6px;
  }
  .vp-render .rr-body img { width: 100%; height: 100%; object-fit: contain; }
  .vp-render .rr-body .wait { color: var(--b-dim); }

  .vp-foot {
    display: flex; flex-wrap: wrap; gap: 14px; padding: 4px 10px; flex: none;
    background: var(--b-head); border-top: 1px solid #101010; color: var(--b-dim);
  }
  .vp-foot b { color: #cfcfcf; font-weight: 600; }
  .vp-foot .right { margin-left: auto; }
</style>
</head>
<body>
<header>
  <h1>dwgforge</h1>
  <span class="sub">Параметрт 3D эд ангийн үүсгэгч · AutoCAD 2026</span>
</header>

<main>
  <section class="pane">
    <div class="tabs" id="tabs"></div>
    <form id="form" autocomplete="off"></form>
    <button class="go" id="go">Үүсгэх</button>
    <div id="msg"></div>
  </section>

  <section class="pane">
    <div class="vp" id="vp">
      <div class="vp-head">
        <span class="vp-ed" title="3D харагдац">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M8 1.6 14 5v6L8 14.4 2 11V5z"/><path d="M2 5l6 3.4L14 5M8 8.4v6"/>
          </svg>
        </span>
        <button class="vp-menu" data-menu="view">Харагдац</button>
        <button class="vp-menu" data-menu="object">Биет</button>
        <span class="vp-gap"></span>
        <div class="vp-shades">
          <button data-shade="wire" title="Утсан загвар (Shift+Z)">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
              <circle cx="8" cy="8" r="6.2"/><ellipse cx="8" cy="8" rx="2.7" ry="6.2"/><path d="M1.8 8h12.4"/>
            </svg>
          </button>
          <button data-shade="solid" class="on" title="Битүү (Z)">
            <svg width="14" height="14" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.2" fill="currentColor"/></svg>
          </button>
          <button data-shade="material" title="Материал (Z)">
            <svg width="14" height="14" viewBox="0 0 16 16">
              <defs><radialGradient id="mpg" cx="35%" cy="30%">
                <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="currentColor"/>
              </radialGradient></defs>
              <circle cx="8" cy="8" r="6.2" fill="url(#mpg)"/>
            </svg>
          </button>
        </div>
        <button class="vp-btn" data-act="render" title="AutoCAD-аар рендерлэх (F12)">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.2">
            <path d="M1.8 4.6h3l1.1-1.6h4.2l1.1 1.6h3v8.2h-12.4z"/><circle cx="8" cy="8.6" r="2.5"/>
          </svg>
        </button>
      </div>

      <div class="vp-body">
        <canvas class="vp-gl"></canvas>
        <div class="vp-corner" data-el="corner"></div>
        <aside class="vp-np" data-el="npanel"></aside>
        <canvas class="vp-gizmo" width="120" height="120"></canvas>
        <div class="vp-stats" data-el="stats"></div>
        <div class="vp-toast" data-el="toast"></div>
        <div class="vp-render" id="rr" hidden>
          <div class="rr-head"><span>Рендер — AutoCAD (далд шугам арилгасан)</span>
            <button id="rr-close" title="Хаах">✕</button></div>
          <div class="rr-body" id="rr-body"></div>
        </div>
      </div>

      <div class="vp-foot">
        <span><b>Чирэх</b> тойруулах</span>
        <span><b>Shift+чирэх</b> зөөх</span>
        <span><b>Дугуй</b> ойртуулах</span>
        <span><b>1/3/7</b> харагдац</span>
        <span><b>5</b> ортогональ</span>
        <span><b>Z</b> сүүдэрлэлт</span>
        <span><b>N</b> самбар</span>
        <span class="right">мм · Z дээшээ</span>
      </div>
    </div>

    <h2>Үүсгэсэн эд ангиуд</h2>
    <table>
      <thead><tr><th>Нэр</th><th class="num">Хэмжээ</th></tr></thead>
      <tbody id="list"><tr><td colspan="2" style="color:var(--dim)">ачаалж байна…</td></tr></tbody>
    </table>
    <div class="path" id="outdir"></div>
  </section>
</main>

<script src="/viewport.js"></script>
<script>
let SCHEMA = null, DN = [], current = null, shown = null;

const $ = (id) => document.getElementById(id);

async function boot() {
  VP.init($('vp'), { onRender: showRender });

  const r = await fetch('/api/schema');
  const d = await r.json();
  SCHEMA = d.parts; DN = d.dn;
  $('outdir').textContent = 'Гаралт: ' + d.outdir;

  $('tabs').innerHTML = '';
  SCHEMA.forEach((p, i) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tab' + (i === 0 ? ' on' : '');
    b.textContent = p.label;
    b.onclick = () => select(p.key);
    b.dataset.key = p.key;
    $('tabs').appendChild(b);
  });

  select(SCHEMA[0].key);
  refresh();
}

function showPart(name) {
  shown = name;
  document.querySelectorAll('#list tr').forEach((tr) => {
    tr.classList.toggle('on', tr.dataset.name === name);
  });
  VP.load(name);
}

/* F12 — AutoCAD-ын өөрийнх нь плоттероор далд шугам арилгасан зураг.
   Меш нь интерактив, энэ нь "жинхэнэ" гаралт: хоёулаа ижил солидоос гарна. */
function showRender(name, view) {
  const box = $('rr-body');
  $('rr').hidden = false;
  box.innerHTML = '<div class="wait">AutoCAD зурж байна…</div>';
  const img = new Image();
  img.onload = () => { box.innerHTML = ''; box.appendChild(img); };
  img.onerror = () => { box.innerHTML = '<div class="wait">зураг гаргаж чадсангүй</div>'; };
  img.src = '/api/preview?name=' + encodeURIComponent(name) +
            '&view=' + encodeURIComponent(view) + '&t=' + Date.now();
}

function select(key) {
  current = SCHEMA.find(p => p.key === key);
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.key === key));

  $('form').innerHTML = '';
  current.fields.forEach(f => {
    const wrap = document.createElement('div');
    wrap.className = 'field';

    const lab = document.createElement('label');
    lab.textContent = f.label + (f.optional ? '' : ' *');
    lab.htmlFor = 'f_' + f.name;
    wrap.appendChild(lab);

    let el;
    // DN талбарууд нь хүснэгтээс ирсэн жагсаалтаас сонгоно — гараар бичвэл
    // хүснэгтэд байхгүй утга оруулж алдаа гаргах магадлалтай.
    if (f.name === 'dn' || f.name === 'dn_small' || f.name === 'branch_dn') {
      el = document.createElement('select');
      if (f.optional) el.appendChild(new Option('(гол шугамтай ижил)', ''));
      DN.forEach(v => el.appendChild(new Option('DN' + v, v)));
      if (f.default != null) el.value = f.default;
    } else {
      el = document.createElement('input');
      el.type = 'number';
      el.step = 'any';
      if (f.default != null) el.value = f.default;
      if (f.optional) el.placeholder = 'автомат (хүснэгтээс)';
    }
    el.id = 'f_' + f.name;
    el.name = f.name;
    wrap.appendChild(el);

    if (f.optional) {
      const h = document.createElement('div');
      h.className = 'hint';
      h.textContent = 'хоосон орхивол hemjees.json-оос авна';
      wrap.appendChild(h);
    }
    $('form').appendChild(wrap);
  });
  $('msg').innerHTML = '';
}

async function build() {
  const params = {};
  new FormData($('form')).forEach((v, k) => { params[k] = v; });

  $('go').disabled = true;
  $('go').textContent = 'AutoCAD ажиллаж байна…';
  $('msg').className = 'msg';
  $('msg').textContent = 'Хүлээнэ үү — ихэвчлэн 3–8 секунд.';

  try {
    const r = await fetch('/api/build', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: current.key, params })
    });
    const d = await r.json();
    if (d.ok) {
      $('msg').className = 'msg ok';
      $('msg').textContent =
        '✓ ' + d.name + '\n' +
        (d.size / 1024).toFixed(1) + ' KB · ' + d.seconds + ' сек\n' + d.path;
      await refresh();
      showPart(d.name);
    } else {
      $('msg').className = 'msg err';
      $('msg').textContent = '✗ ' + (d.error || 'тодорхойгүй алдаа');
    }
  } catch (e) {
    $('msg').className = 'msg err';
    $('msg').textContent = '✗ сервертэй холбогдож чадсангүй: ' + e;
  } finally {
    $('go').disabled = false;
    $('go').textContent = 'Үүсгэх';
  }
}

async function refresh() {
  const r = await fetch('/api/parts');
  const d = await r.json();
  const tb = $('list');
  tb.innerHTML = '';
  if (!d.parts.length) {
    tb.innerHTML = '<tr><td colspan="2" style="color:var(--dim)">хоосон</td></tr>';
    return;
  }
  d.parts.forEach(p => {
    const tr = document.createElement('tr');
    tr.dataset.name = p.name;
    const a = document.createElement('td'); a.textContent = p.name;
    const b = document.createElement('td'); b.className = 'num';
    b.textContent = (p.size / 1024).toFixed(1) + ' KB';
    tr.append(a, b);
    tr.classList.toggle('on', p.name === shown);
    tr.onclick = () => showPart(p.name);
    tb.appendChild(tr);
  });
}

$('go').onclick = build;
$('rr-close').onclick = () => { $('rr').hidden = true; };
boot();
</script>
</body>
</html>
